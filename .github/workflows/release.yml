name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - name: Prepare draft release
        run: |
          echo 'Desktop and mobile workflows upload installers as Actions artifacts.'
          echo 'Run those workflows manually, then download the artifacts from the run.'
          echo 'Device IPA and production Android signing stay manual and need your credentials.'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          draft: true
