name: Publish release assets

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - name: Wait for build workflows and publish from their artifacts
        run: |
          echo 'Desktop and mobile workflows upload installers as Actions artifacts.'
          echo 'Build workflows also attach their completed installer assets when triggered by a version tag.'
          echo 'Device IPA and production Android signing are deliberately not automated without credentials.'
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
