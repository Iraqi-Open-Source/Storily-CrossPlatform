name: Build Storily desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            bundles: nsis,msi
            artifact: Storily-Windows-x64
          - name: Linux x64
            os: ubuntu-22.04
            bundles: deb,appimage,rpm
            artifact: Storily-Linux-x64
          - name: macOS Apple Silicon
            os: macos-15
            bundles: app,dmg
            artifact: Storily-macOS-arm64
          - name: macOS Intel
            os: macos-15-intel
            bundles: app,dmg
            artifact: Storily-macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Use the exact original Storily icon
        run: python scripts/sync_original_icon.py --strict
      - name: Check frontend
        run: npm run build
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build native installers
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles ${{ matrix.bundles }} --ci
      - name: Zip .app bundles with preserved macOS metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p distribution
          find src-tauri/target -type d -name '*.app' -path '*/bundle/macos/*' -print0 | while IFS= read -r -d '' app; do
            ditto -c -k --sequesterRsrc --keepParent "$app" "distribution/$(basename "$app")-${{ matrix.artifact }}.zip"
          done
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p distribution
          find src-tauri/target -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -path '*/bundle/*' -exec cp -n {} distribution/ \;
          ls -lah distribution
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: distribution/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach built installer assets to draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: distribution/*
          fail_on_unmatched_files: true
